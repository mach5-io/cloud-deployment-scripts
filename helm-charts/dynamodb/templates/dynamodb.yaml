apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb
  labels:
    app: dynamodb
spec:
  selector:
    matchLabels:
      app: dynamodb
  template:
    metadata:
      labels:
        app: dynamodb
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      containers:
        - name: dynamodb
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: dynamodb
spec:
  type: ClusterIP
  ports:
    - port: 8000
  selector:
    app: dynamodb
